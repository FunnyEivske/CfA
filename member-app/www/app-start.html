<!DOCTYPE html>
<html lang="no">
<head>
    <script>window.CFA_API_BASE = 'https://cosplayforalle.no/backend/api.php';</script>
    <base href="/">
    <meta charset="UTF-8">
    <!-- Google Consent Mode v2: Standardstatus (Må ligge øverst i head før sporingsskript) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      (function() {
        var consent = null;
        try { consent = JSON.parse(localStorage.getItem('cookie_consent')); } catch (e) {}
        gtag('consent', 'default', {
          'ad_storage': (consent && consent.marketing) ? 'granted' : 'denied',
          'ad_user_data': (consent && consent.marketing) ? 'granted' : 'denied',
          'ad_personalization': (consent && consent.marketing) ? 'granted' : 'denied',
          'analytics_storage': (consent && consent.analytics) ? 'granted' : 'denied',
          'functionality_storage': 'granted',
          'security_storage': 'granted',
          'wait_for_update': 500
        });
      })();
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18472435099"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'AW-18472435099');
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cosplay for alle</title>
    <meta name="description" content="Start Cosplay for alle-appen og få direkte tilgang til medlemsportalen.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6E0A2D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="Media/Logo/icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #18181B;
            color: #F4F4F5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
            user-select: none;
            -webkit-user-select: none;
        }
        .splash-logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 3px solid #6E0A2D;
            margin-bottom: 1.5rem;
            animation: pulse 1.8s infinite ease-in-out;
        }
        .splash-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #F3B716;
            margin-bottom: 0.5rem;
        }
        .splash-sub {
            font-size: 0.875rem;
            color: #BCBCBC;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(243, 183, 22, 0.2);
            border-top-color: #F3B716;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 2rem;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <img src="Media/Logo/icon-192.png" alt="Cosplay for alle" class="splash-logo">
    <h1 class="splash-title">Cosplay for alle</h1>
    <p class="splash-sub">Åpner portal...</p>
    <div class="spinner"></div>

    <script type="module">
        import { AuthAPI } from '/js/api-client.js';

        async function routeApp() {
            try {
                const res = await AuthAPI.getAuthState();
                if (res && res.authenticated && res.user) {
                    window.location.replace('medlem');
                } else {
                    window.location.replace('login');
                }
            } catch (err) {
                // Ved nettverksfeil eller timeout, send til login
                window.location.replace('login');
            }
        }

        // Kjør ruting straks dokumentet er klart
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', routeApp);
        } else {
            routeApp();
        }
    </script>
    <script defer src="js/cookie-consent.js"></script>
</body>
</html>
