<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visittkort og roll-up – Cosplay for Alle</title>
<meta name="theme-color" content="#18181b">
<link rel="stylesheet" href="assets/cfa.css">
<style>
  .kortpar { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; }
  .kortpar figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 12px; color: var(--tekst-svak); }
  .kortpar canvas { box-shadow: 0 8px 24px rgba(0,0,0,.45); border-radius: 2px; }
</style>
</head>
<body>
<main class="side">
  <nav class="faner" data-aktiv="trykksaker" aria-label="Merkeverktøy"></nav>
  <h1>Visittkort og roll-up</h1>
  <p class="ingress">Trykkfiler med riktig marg, logostørrelse og 3 mm utfallende. Send PDF-en rett til trykkeriet.</p>

  <div class="verktoy">
    <form class="panel" id="skjema" autocomplete="off">
      <fieldset>
        <legend>Produkt</legend>
        <div class="valg" role="radiogroup" aria-label="Produkt">
          <input type="radio" name="produkt" id="p-kort" value="kort" checked><label for="p-kort">Visittkort<small>85 × 55 mm</small></label>
          <input type="radio" name="produkt" id="p-rollup" value="rollup"><label for="p-rollup">Roll-up<small>85 × 200 cm</small></label>
        </div>
      </fieldset>

      <fieldset id="kort-felt">
        <legend>Visittkort</legend>
        <div class="felt"><label for="k-navn">Navn</label><input type="text" id="k-navn" value="Kari Nordmann"></div>
        <div class="felt"><label for="k-rolle">Rolle</label><input type="text" id="k-rolle" value="Styreleder"></div>
        <div class="rad">
          <div class="felt"><label for="k-tlf">Telefon</label><input type="text" id="k-tlf" value="400 00 000"></div>
          <div class="felt"><label for="k-lag">Lokallag</label><input type="text" id="k-lag" value="" placeholder="Agder"></div>
        </div>
        <div class="felt"><label for="k-epost">E-post</label><input type="text" id="k-epost" value="kontakt@cosplayforalle.no"></div>
        <div class="felt"><label for="k-web">Nettside</label><input type="text" id="k-web" value="cosplayforalle.no"></div>
        <div class="felt">
          <span class="etikett" id="kf-etikett">Fil</span>
          <div class="valg" role="radiogroup" aria-labelledby="kf-etikett">
            <input type="radio" name="kortfil" id="kf-trykk" value="trykk" checked><label for="kf-trykk">Til trykkeriet<small>91 × 61 mm med utfallende</small></label>
            <input type="radio" name="kortfil" id="kf-a4" value="a4"><label for="kf-a4">Skriv ut selv<small>10 per A4, tosidig</small></label>
          </div>
        </div>
      </fieldset>

      <fieldset id="rollup-felt" hidden>
        <legend>Roll-up</legend>
        <div class="felt"><label for="r-lag">Lokallag <span class="hint">(erstatter slagordet under navnet)</span></label><input type="text" id="r-lag" value="" placeholder="Agder"></div>
        <label class="fil" id="bilde-sone" for="bilde">
          <input type="file" id="bilde" accept="image/*">
          <strong>Velg bilde</strong>
          <span class="hint">Bruk et stort bilde, minst 4000 px bredt.</span>
        </label>
        <div class="felt"><label for="r-tittel">Tittel</label><input type="text" id="r-tittel" value="Lag kostymet du drømmer om"></div>
        <div class="felt">
          <label for="r-punkter">Punkter, ett per linje</label>
          <textarea id="r-punkter" rows="3">Gratis workshops
Alle nivåer er velkomne
Vi har verktøy du kan låne</textarea>
        </div>
        <div class="felt"><label for="r-web">Nettside</label><input type="text" id="r-web" value="cosplayforalle.no"></div>
        <label class="bryter" for="r-hjelp"><input type="checkbox" id="r-hjelp" checked> Vis marg og området foten kan skjule</label>
      </fieldset>
    </form>

    <section class="visning kort" aria-label="Forhåndsvisning">
      <div class="kort-hode"><h2>Forhåndsvisning</h2><span class="lapp" id="lapp">Visittkort</span></div>
      <div class="kort-kropp">
        <div class="lerret-ramme" id="ramme">
          <div class="kortpar" id="kortpar">
            <figure><canvas id="forside"></canvas><figcaption>Forside</figcaption></figure>
            <figure><canvas id="bakside"></canvas><figcaption>Bakside</figcaption></figure>
          </div>
          <canvas id="rollup" hidden></canvas>
        </div>
        <div class="mal" id="mal"></div>
        <div class="knapper"><button type="button" class="knapp" id="last-pdf">Last ned PDF</button></div>
        <p class="status" id="status" role="status"></p>
        <ul class="sjekk" id="sjekk"></ul>
      </div>
    </section>
  </div>
</main>

<script src="assets/cfa-merke.js"></script>
<script>
(function () {
  'use strict';
  var F = CfA.FARGE;
  var PT = 25.4 / 72;
  var UTF = 3; // utfallende
  var $ = function (id) { return document.getElementById(id); };
  var logo = null, bilde = null;
  function verdi(n) { var el = document.querySelector('input[name="' + n + '"]:checked'); return el ? el.value : null; }

  // ---------- visittkort: 85 × 55, marg 5 mm (side 13), logo 20 mm (side 6) ----------
  function tegnKort(c, side, x, y, utf) {
    var W = 85, H = 55, M = 5;
    var b = utf ? UTF : 0;
    c.save();
    c.beginPath(); c.rect(x - b, y - b, W + 2 * b, H + 2 * b); c.clip();
    c.textBaseline = 'alphabetic'; c.textAlign = 'left';
    if (side === 'for') {
      c.fillStyle = '#fff'; c.fillRect(x - b, y - b, W + 2 * b, H + 2 * b);
      var lh = 20;
      var lag = $('k-lag').value.trim();
      CfA.tegnLogoMedNavn(c, logo, x + M, y + (H - lh) / 2, lh, lag || 'Sammen om kreativitet');
      c.fillStyle = F.gull; c.fillRect(x - b, y + H - 1.6, W + 2 * b, 1.6 + b);
    } else {
      // vinrød flate, hvit tekst, gull bare i små ord (side 10)
      c.fillStyle = F.vinrod; c.fillRect(x - b, y - b, W + 2 * b, H + 2 * b);
      var ty = y + M + 11 * PT;
      CfA.settFont(c, 700, 11 * PT, 0); c.fillStyle = '#fff';
      c.fillText($('k-navn').value.trim() || 'Navn', x + M, ty);
      var rolle = $('k-rolle').value.trim();
      if (rolle) { ty += 4.6; CfA.settFont(c, 700, 7.5 * PT, 0); c.fillStyle = F.gull; c.fillText(rolle, x + M, ty); }
      var linjer = [$('k-tlf').value.trim(), $('k-epost').value.trim(), $('k-web').value.trim()].filter(Boolean);
      CfA.settFont(c, 400, 8 * PT, 0); c.fillStyle = '#fff';
      var ly = y + H - M - (linjer.length - 1) * 4.1;
      linjer.forEach(function (l, i) { c.fillText(l, x + M, ly + i * 4.1); });
    }
    c.restore();
  }

  function kortLerret(side, s) {
    var b = 85 + 2 * UTF, h = 55 + 2 * UTF;
    var c = document.createElement('canvas');
    c.width = Math.round(b * s); c.height = Math.round(h * s);
    var ctx = c.getContext('2d');
    ctx.setTransform(s, 0, 0, s, 0, 0);
    tegnKort(ctx, side, UTF, UTF, true);
    return c;
  }

  function a4Kort(side) {
    var m = CfA.mmLerret(210, 297, 300);
    var c = m.ctx; c.setTransform(m.s, 0, 0, m.s, 0, 0);
    c.fillStyle = '#fff'; c.fillRect(0, 0, 210, 297);
    var x0 = 20, y0 = 11;
    for (var r = 0; r < 5; r++) for (var k = 0; k < 2; k++) {
      var kol = side === 'bak' ? 1 - k : k; // speilvendt for tosidig utskrift (lang kant)
      tegnKort(c, side, x0 + kol * 85, y0 + r * 55, false);
    }
    c.strokeStyle = '#000'; c.lineWidth = 0.15;
    [20, 105, 190].forEach(function (x) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 8); c.moveTo(x, 289); c.lineTo(x, 297); c.stroke(); });
    for (var i = 0; i <= 5; i++) { var y = 11 + i * 55; c.beginPath(); c.moveTo(0, y); c.lineTo(17, y); c.moveTo(193, y); c.lineTo(210, y); c.stroke(); }
    return { c: m.c, mmB: 210, mmH: 297 };
  }

  // ---------- roll-up: 850 × 2000, marg 60 mm, stående logo 300 mm (side 6, 7, 13) ----------
  var RU = { W: 850, H: 2000, M: 60, logo: 300, fot: 150 };
  function tegnRollup(c, s, hjelp) {
    var W = RU.W, H = RU.H, M = RU.M, b = UTF;
    var mal = {};
    c.save();
    c.setTransform(s, 0, 0, s, b * s, b * s);
    c.fillStyle = '#fff'; c.fillRect(-b, -b, W + 2 * b, H + 2 * b);
    c.textBaseline = 'alphabetic';
    // stående logo med navn
    var lh = RU.logo, lb = CfA.logoBredde(lh);
    var y = M + 20;
    CfA.tegnLogo(c, logo, (W - lb) / 2, y, lh);
    y += lh + lb / 4;
    var np = 0.18 * lh;
    CfA.settFont(c, 700, np, 0); c.fillStyle = F.vinrod; c.textAlign = 'center';
    c.fillText('Cosplay for Alle', W / 2, y + np * 0.72);
    y += np * 0.72 + np * 0.42;
    var up = 0.45 * np;
    CfA.settFont(c, 400, up, 0); c.fillStyle = F.tekst;
    c.fillText($('r-lag').value.trim() || 'Sammen om kreativitet', W / 2, y + up * 0.72);
    y += up * 0.72 + 60;
    // bilde
    var innB = W - 2 * M, bh = 520;
    if (bilde) {
      c.save(); CfA.rundRekt(c, M, y, innB, bh, 8); c.clip();
      CfA.tegnDekk(c, bilde, M, y, innB, bh, 0.5, 0.45); c.restore();
      var sk = Math.max(innB / bilde.naturalWidth, bh / bilde.naturalHeight);
      mal.dpi = Math.round(25.4 / sk);
    } else {
      c.fillStyle = F.lysgra; c.fillRect(M, y, innB, bh);
    }
    y += bh + 60;
    // tittel
    c.textAlign = 'left';
    var tp = 64;
    CfA.settFont(c, 700, tp, -0.02); c.fillStyle = F.vinrod;
    CfA.brytTekst(c, $('r-tittel').value.trim(), innB).forEach(function (l) { c.fillText(l, M, y + tp * 0.78); y += tp * 1.04; });
    y += 30;
    // punkter med små gullprikker
    var pp = 34;
    $('r-punkter').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean).forEach(function (l) {
      c.fillStyle = F.gull; c.beginPath(); c.arc(M + 8, y + pp * 0.4, 7, 0, Math.PI * 2); c.fill();
      CfA.settFont(c, 400, pp, 0); c.fillStyle = F.tekst;
      CfA.brytTekst(c, l, innB - 32).forEach(function (t) { c.fillText(t, M + 32, y + pp * 0.75); y += pp * 1.45; });
      y += 10;
    });
    // nettside rett over området foten kan skjule
    var webY = H - RU.fot - 40;
    CfA.settFont(c, 700, 44, 0); c.fillStyle = F.vinrod;
    c.fillText($('r-web').value.trim(), M, webY);
    mal.overlapp = y > webY - 60;
    c.fillStyle = F.vinrod; c.fillRect(-b, H - RU.fot, W + 2 * b, RU.fot + b);
    if (hjelp) {
      var px = 1 / s;
      c.setLineDash([12, 8]); c.lineWidth = 3 * px;
      c.strokeStyle = F.gull; c.strokeRect(M, M, W - 2 * M, H - 2 * M);
      c.strokeStyle = '#D0021B'; c.beginPath(); c.moveTo(0, H - RU.fot); c.lineTo(W, H - RU.fot); c.stroke();
    }
    c.restore();
    return mal;
  }

  // ---------- visning ----------
  var sisteMal = {};
  function vis() {
    if (!logo) return;
    var rollup = verdi('produkt') === 'rollup';
    $('kort-felt').hidden = rollup; $('rollup-felt').hidden = !rollup;
    $('kortpar').hidden = rollup; $('rollup').hidden = !rollup;
    $('lapp').textContent = rollup ? 'Roll-up' : 'Visittkort';
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var punkter = [];
    if (!rollup) {
      var visB = Math.min(320, ($('ramme').clientWidth - 60) / ($('ramme').clientWidth > 700 ? 2 : 1));
      var s = visB / (85 + 2 * UTF) * dpr;
      ['for', 'bak'].forEach(function (side) {
        var src = kortLerret(side, s);
        var el = $(side === 'for' ? 'forside' : 'bakside');
        el.width = src.width; el.height = src.height;
        el.style.width = Math.round(src.width / dpr) + 'px';
        el.getContext('2d').drawImage(src, 0, 0);
      });
      var kf = verdi('kortfil');
      $('mal').innerHTML = kf === 'trykk'
        ? '<span>Ferdig <b>85 × 55 mm</b></span><span>Med utfallende <b>91 × 61 mm</b></span><span>Marg <b>5 mm</b></span><span>Logo <b>20 mm</b> høy</span><span>PDF <b>2 sider, 300 dpi</b></span>'
        : '<span><b>10 kort per A4</b></span><span>Side 2 er speilvendt for tosidig utskrift langs lang kant</span>';
      punkter.push({ ok: true, tekst: 'Logoen er 20 mm høy, minstestørrelsen på trykk' });
      punkter.push({ ok: true, tekst: 'Baksiden er vinrød med hvit tekst. Gull brukes bare på rollen.' });
    } else {
      var r = $('rollup');
      var hoyde = Math.min(window.innerHeight * 0.75, 760);
      var bb = hoyde * (RU.W + 2 * UTF) / (RU.H + 2 * UTF);
      r.width = Math.round(bb * dpr); r.height = Math.round(hoyde * dpr);
      r.style.width = Math.round(bb) + 'px'; r.style.height = Math.round(hoyde) + 'px';
      sisteMal = tegnRollup(r.getContext('2d'), r.width / (RU.W + 2 * UTF), $('r-hjelp').checked);
      $('mal').innerHTML = '<span>Ferdig <b>850 × 2000 mm</b></span><span>Marg <b>60 mm</b></span><span>Logo <b>300 mm</b> høy</span><span>PDF <b>150 dpi</b> med 3 mm utfallende</span>';
      punkter.push({ ok: true, tekst: 'Stående logo med navn øverst, slik side 7 sier for roll-up' });
      if (sisteMal.dpi) punkter.push(sisteMal.dpi >= 100
        ? { ok: true, tekst: 'Bildet holder ' + sisteMal.dpi + ' dpi i full størrelse' }
        : { ok: false, tekst: 'Bildet holder bare ' + sisteMal.dpi + ' dpi i full størrelse. En roll-up trenger minst 100 dpi, så bruk et større bilde.' });
      punkter.push(sisteMal.overlapp
        ? { ok: false, tekst: 'Punktene går ned mot nettadressen. Kort ned teksten.' }
        : { ok: true, tekst: 'Alt står over de nederste 15 cm, som foten kan skjule' });
    }
    $('sjekk').innerHTML = CfA.sjekkHtml(punkter);
  }

  $('last-pdf').addEventListener('click', function () {
    var rollup = verdi('produkt') === 'rollup';
    $('status').textContent = 'Lager PDF …';
    setTimeout(function () {
      var sider, navn;
      if (!rollup) {
        if (verdi('kortfil') === 'trykk') {
          var s = 300 / 25.4;
          sider = ['for', 'bak'].map(function (side) { return { c: kortLerret(side, s), mmB: 85 + 2 * UTF, mmH: 55 + 2 * UTF }; });
          navn = 'visittkort-' + CfA.filnavn($('k-navn').value) + '-trykk.pdf';
        } else {
          sider = [a4Kort('for'), a4Kort('bak')];
          navn = 'visittkort-' + CfA.filnavn($('k-navn').value) + '-a4.pdf';
        }
      } else {
        var m = CfA.mmLerret(RU.W + 2 * UTF, RU.H + 2 * UTF, 150);
        tegnRollup(m.ctx, m.s, false);
        sider = [{ c: m.c, mmB: RU.W + 2 * UTF, mmH: RU.H + 2 * UTF }];
        navn = 'rollup-' + CfA.filnavn($('r-lag').value || 'cfa') + '.pdf';
      }
      CfA.pdfAvLerreter(sider, 0.92).then(function (pdf) {
        CfA.lastNed(pdf, navn);
        $('status').textContent = 'Lastet ned ' + navn + '.';
      }).catch(function (e) { $('status').textContent = 'Noe gikk galt: ' + e.message; });
    }, 30);
  });

  CfA.filSone($('bilde-sone'), $('bilde'), function (fil) {
    CfA.lastBilde(URL.createObjectURL(fil)).then(function (img) {
      bilde = img;
      $('status').textContent = 'Bruker ' + fil.name + ' (' + img.naturalWidth + ' × ' + img.naturalHeight + ' px)';
      vis();
    }).catch(function () { $('status').textContent = 'Klarte ikke å lese bildet.'; });
  });
  $('skjema').addEventListener('input', vis);
  $('skjema').addEventListener('change', vis);
  $('skjema').addEventListener('submit', function (e) { e.preventDefault(); });
  window.addEventListener('resize', vis);
  Promise.all([CfA.logo(), CfA.lastBilde(CfA.ASSETS + 'eksempel-gruppe.jpg').catch(function () { return null; })])
    .then(function (r) { logo = r[0]; bilde = r[1]; vis(); });
})();
</script>
</body>
</html>
