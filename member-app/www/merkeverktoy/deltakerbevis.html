<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deltakerbevis – Cosplay for Alle</title>
<meta name="theme-color" content="#18181b">
<link rel="stylesheet" href="assets/cfa.css">
</head>
<body>
<main class="side">
  <nav class="faner" data-aktiv="deltakerbevis" aria-label="Merkeverktøy"></nav>
  <h1>Deltakerbevis</h1>
  <p class="ingress">Et bevis til alle som har vært med på en workshop. Lim inn navnene, så får hver deltaker sin egen side i samme PDF.</p>

  <div class="verktoy">
    <form class="panel" id="skjema" autocomplete="off">
      <fieldset>
        <legend>Workshopen</legend>
        <div class="felt">
          <label for="workshop">Navn på workshopen</label>
          <input type="text" id="workshop" value="EVA-skum for nybegynnere" maxlength="70">
        </div>
        <div class="felt">
          <span class="etikett" id="formulering-etikett">Formulering</span>
          <div class="valg" role="radiogroup" aria-labelledby="formulering-etikett">
            <input type="radio" name="formulering" id="fo-deltatt" value="har deltatt på" checked><label for="fo-deltatt">har deltatt på</label>
            <input type="radio" name="formulering" id="fo-fullfort" value="har fullført"><label for="fo-fullfort">har fullført</label>
          </div>
        </div>
        <div class="felt">
          <label for="beskrivelse">Hva de lærte <span class="hint">(valgfri)</span></label>
          <textarea id="beskrivelse" rows="2">Mønster, varmeforming og maling av rustning i EVA-skum.</textarea>
        </div>
        <div class="rad">
          <div class="felt">
            <label for="dato">Dato</label>
            <input type="text" id="dato" value="14. november 2026">
          </div>
          <div class="felt">
            <label for="sted">Sted</label>
            <input type="text" id="sted" value="Arendal">
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Deltakere</legend>
        <div class="felt">
          <label for="navn">Ett navn per linje</label>
          <textarea id="navn" rows="6" spellcheck="false">Kari Nordmann
Ola Nordmann
Ingrid Hansen</textarea>
        </div>
        <div class="felt">
          <label for="vis">Forhåndsvis</label>
          <select id="vis"></select>
        </div>
      </fieldset>
      <fieldset>
        <legend>Underskrift</legend>
        <div class="rad">
          <div class="felt">
            <label for="signatur">Navn</label>
            <input type="text" id="signatur" value="" placeholder="For eksempel Kari Nordmann">
          </div>
          <div class="felt">
            <label for="rolle">Rolle</label>
            <input type="text" id="rolle" value="Workshopleder">
          </div>
        </div>
        <div class="felt">
          <label for="lokallag">Lokallag <span class="hint">(valgfri)</span></label>
          <input type="text" id="lokallag" value="" placeholder="For eksempel Agder">
        </div>
        <div class="felt">
          <span class="etikett" id="retning-etikett">Retning</span>
          <div class="valg" role="radiogroup" aria-labelledby="retning-etikett">
            <input type="radio" name="retning" id="r-ligg" value="liggende" checked><label for="r-ligg">Liggende A4</label>
            <input type="radio" name="retning" id="r-staa" value="staaende"><label for="r-staa">Stående A4</label>
          </div>
        </div>
      </fieldset>
    </form>

    <section class="visning kort" aria-label="Forhåndsvisning">
      <div class="kort-hode"><h2>Forhåndsvisning</h2><span class="lapp" id="lapp">3 bevis</span></div>
      <div class="kort-kropp">
        <div class="lerret-ramme" id="ramme"><canvas id="lerret" width="594" height="420"></canvas></div>
        <div class="knapper">
          <button type="button" class="knapp" id="last-pdf">Last ned PDF</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </div>
</main>

<script src="assets/cfa-merke.js"></script>
<script>
(function () {
  'use strict';
  var F = CfA.FARGE;
  var PT = 25.4 / 72;
  var $ = function (id) { return document.getElementById(id); };
  var logo = null;

  function verdi(n) { var el = document.querySelector('input[name="' + n + '"]:checked'); return el ? el.value : null; }
  function navneliste() { return $('navn').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean); }
  function mal() { return verdi('retning') === 'liggende' ? { b: 297, h: 210 } : { b: 210, h: 297 }; }

  function senter(c, tekst, y, vekt, pt, farge, maksB, W) {
    var px = pt * PT;
    CfA.settFont(c, vekt, px, vekt === 700 ? -0.01 : 0);
    var b = c.measureText(tekst).width;
    if (b > maksB) { px *= maksB / b; CfA.settFont(c, vekt, px, 0); }
    c.fillStyle = farge;
    c.textAlign = 'center';
    c.fillText(tekst, W / 2, y);
    return px;
  }

  // Et diplom er en forside: korte titler kan midtstilles (side 11). Marg 15 mm på A4 (side 13).
  function tegnBevis(c, s, navn) {
    var M = mal(), W = M.b, H = M.h, marg = 15;
    var ligg = W > H;
    c.save();
    c.setTransform(s, 0, 0, s, 0, 0);
    c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
    c.textBaseline = 'alphabetic';
    // tynn gull ramme innenfor margen (aksent)
    c.strokeStyle = F.gull; c.lineWidth = 0.8;
    c.strokeRect(marg - 6, marg - 6, W - 2 * (marg - 6), H - 2 * (marg - 6));

    var logoH = ligg ? 34 : 40;
    CfA.tegnLogo(c, logo, (W - CfA.logoBredde(logoH)) / 2, marg + 4, logoH);
    var y = marg + 4 + logoH + 14;
    var innB = W - 2 * marg - 20;

    senter(c, 'Deltakerbevis', y, 700, 34, F.vinrod, innB, W);
    y += 8;
    c.fillStyle = F.gull; c.fillRect(W / 2 - 15, y, 30, 1.2);
    y += (ligg ? 14 : 20);
    senter(c, 'Dette bekrefter at', y, 400, 13, F.tekst, innB, W);
    y += ligg ? 16 : 20;
    senter(c, navn || 'Navn Navnesen', y, 700, ligg ? 32 : 30, F.vinrod, innB, W);
    y += ligg ? 13 : 16;
    var ws = $('workshop').value.trim();
    senter(c, verdi('formulering') + ' workshopen ' + (ws ? '«' + ws + '»' : ''), y, 400, 14, F.tekst, innB, W);
    var besk = $('beskrivelse').value.trim();
    if (besk) {
      y += 9;
      CfA.settFont(c, 400, 11.5 * PT, 0);
      CfA.brytTekst(c, besk, Math.min(innB, 150)).forEach(function (l) {
        c.fillStyle = '#4a4a4a'; c.textAlign = 'center'; c.fillText(l, W / 2, y); y += 11.5 * PT * 1.45;
      });
    }
    var datoSted = [$('sted').value.trim(), $('dato').value.trim()].filter(Boolean).join(', ');

    // underskrift og dato nederst
    var by = H - marg - 16;
    var kolB = 70;
    c.strokeStyle = '#909090'; c.lineWidth = 0.3;
    var venstreX = ligg ? W / 2 - kolB - 15 : marg + 10;
    var hoyreX = ligg ? W / 2 + 15 : W - marg - 10 - kolB;
    c.beginPath(); c.moveTo(venstreX, by); c.lineTo(venstreX + kolB, by); c.moveTo(hoyreX, by); c.lineTo(hoyreX + kolB, by); c.stroke();
    c.textAlign = 'left';
    CfA.settFont(c, 400, 10 * PT, 0); c.fillStyle = F.tekst;
    c.fillText(datoSted || 'Sted og dato', venstreX, by - 2.5);
    CfA.settFont(c, 400, 8.5 * PT, 0); c.fillStyle = '#5a5a5a';
    c.fillText('Sted og dato', venstreX, by + 4.5);
    var sig = $('signatur').value.trim(), rolle = $('rolle').value.trim();
    var lag = $('lokallag').value.trim();
    CfA.settFont(c, 700, 10 * PT, 0); c.fillStyle = F.tekst;
    if (sig) c.fillText(sig, hoyreX, by + 4.5);
    CfA.settFont(c, 400, 8.5 * PT, 0); c.fillStyle = '#5a5a5a';
    c.fillText([rolle, 'Cosplay for Alle' + (lag ? ' – ' + lag : '')].filter(Boolean).join(', '), hoyreX, by + (sig ? 9 : 4.5));

    // slagordet står alene nederst (side 3)
    CfA.settFont(c, 400, 9 * PT, 0); c.fillStyle = '#5a5a5a'; c.textAlign = 'center';
    c.fillText('Sammen om kreativitet', W / 2, H - marg + 2);
    c.restore();
  }

  function oppdaterValg() {
    var liste = navneliste();
    var forrige = $('vis').value;
    $('vis').innerHTML = liste.map(function (n, i) { return '<option value="' + i + '">' + n.replace(/</g, '&lt;') + '</option>'; }).join('') || '<option value="-1">Ingen navn ennå</option>';
    if (forrige && +forrige < liste.length) $('vis').value = forrige;
    $('lapp').textContent = liste.length + (liste.length === 1 ? ' bevis' : ' bevis');
  }

  var lerret = $('lerret');
  function vis() {
    if (!logo) return;
    var M = mal();
    var ramme = $('ramme');
    var visB = Math.min(ramme.clientWidth - 40, window.innerHeight * 0.7 * M.b / M.h);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    lerret.width = Math.round(visB * dpr); lerret.height = Math.round(visB * M.h / M.b * dpr);
    lerret.style.width = Math.round(visB) + 'px'; lerret.style.height = Math.round(visB * M.h / M.b) + 'px';
    var liste = navneliste();
    tegnBevis(lerret.getContext('2d'), lerret.width / M.b, liste[+$('vis').value] || liste[0]);
  }

  $('last-pdf').addEventListener('click', function () {
    var liste = navneliste();
    if (!liste.length) { $('status').textContent = 'Skriv inn minst ett navn.'; return; }
    var M = mal();
    $('status').textContent = 'Lager ' + liste.length + ' bevis …';
    var sider = liste.map(function (n) {
      var m = CfA.mmLerret(M.b, M.h, 300);
      tegnBevis(m.ctx, m.s, n);
      return { c: m.c, mmB: M.b, mmH: M.h };
    });
    CfA.pdfAvLerreter(sider, 0.94).then(function (pdf) {
      var n = 'deltakerbevis-' + CfA.filnavn($('workshop').value) + '.pdf';
      CfA.lastNed(pdf, n);
      $('status').textContent = 'Lastet ned ' + n + ' med ' + liste.length + ' sider.';
    });
  });

  $('navn').addEventListener('input', oppdaterValg);
  $('skjema').addEventListener('input', vis);
  $('skjema').addEventListener('change', vis);
  $('skjema').addEventListener('submit', function (e) { e.preventDefault(); });
  window.addEventListener('resize', vis);
  oppdaterValg();
  CfA.logo().then(function (l) { logo = l; vis(); });
})();
</script>
</body>
</html>
