<!DOCTYPE html>
<html lang="no" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Profil - Cosplay for alle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme-switcher.js"></script>
    <link rel="icon" type="image/jpeg" href="Media/Logo/cfa-logo.jpg">
</head>

<body style="background-color: var(--color-bg-page); color: var(--color-text-main);">

    <!-- Header & Navigasjon -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm">
        <nav class="container mx-auto px-6 py-3">
            <div class="flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <img src="Media/Logo/cfa-logo.jpg" alt="Cosplay for alle Logo" class="h-12 w-12 rounded-full object-cover">
                    <span class="text-xl font-semibold logo-text">CfA</span>
                </a>
                <!-- Desktop-meny -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="om-oss.html" class="text-stone-600 hover:text-amber-800 transition-colors">Om oss</a>
                    <a href="hva-skjer.html" class="text-stone-600 hover:text-amber-800 transition-colors">Conventions</a>
                    <a href="galleri.html" class="text-stone-600 hover:text-amber-800 transition-colors">Galleri</a>
                    <a href="kontakt.html" class="text-stone-600 hover:text-amber-800 transition-colors">Kontakt</a>
                    <a id="member-link" href="medlem.html" class="hidden text-stone-600 hover:text-amber-800 transition-colors">Medlemsside</a>

                    <a id="profile-link" href="profil.html" class="hidden h-10 w-10 rounded-full overflow-hidden border-2 border-amber-700 transition-transform hover:scale-110" title="Min Profil">
                        <img id="profile-image-header" src="Media/Logo/cfa-logo.jpg" alt="Din profil" class="h-full w-full object-cover">
                    </a>

                    <button id="logout-button" class="hidden bg-stone-500 hover:bg-stone-600 text-white font-bold py-2 px-5 rounded-full text-sm transition-colors">
                        Logg ut
                    </button>
                    <a id="login-link" href="login.html" class="bg-amber-700 hover:bg-amber-800 text-white font-bold py-2 px-5 rounded-full text-sm transition-colors">
                        Logg inn
                    </a>
                </div>
                <!-- Mobilmeny-knapp -->
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-stone-700 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Mobilmeny -->
            <div id="mobile-menu" class="md:hidden mt-4 space-y-2">
                <a href="om-oss.html" class="block py-2 text-stone-600 hover:text-amber-800">Om oss</a>
                <a href="hva-skjer.html" class="block py-2 text-stone-600 hover:text-amber-800">Conventions</a>
                <a href="galleri.html" class="block py-2 text-stone-600 hover:text-amber-800">Galleri</a>
                <a href="kontakt.html" class="block py-2 text-stone-600 hover:text-amber-800">Kontakt</a>
                <a id="mobile-member-link" href="medlem.html" class="hidden block py-2 text-stone-600 hover:text-amber-800">Medlemsside</a>
                <a id="mobile-profile-link" href="profil.html" class="hidden block py-2 text-amber-700 font-semibold hover:text-amber-800">Min Profil</a>
                <a id="mobile-login-link" href="login.html" class="w-full text-left block py-2 text-stone-600 hover:text-amber-800">Logg inn</a>
                <button id="mobile-logout-button" class="hidden w-full text-left block py-2 text-stone-600 hover:text-amber-800">Logg ut</button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12 md:py-20">
        <div class="max-w-lg mx-auto p-8 rounded-lg shadow-xl" style="background-color: var(--color-bg-card);">
            <h1 class="font-display text-4xl font-bold mb-8 text-center" style="color: var(--color-text-main);">Min Profil</h1>

            <!-- Profilbilde-seksjon -->
            <div class="text-center mb-8">
                <img id="profile-image-preview" src="Media/Logo/cfa-logo.jpg" alt="Profilbilde" class="w-40 h-40 rounded-full object-cover mx-auto mb-4 bg-stone-200">
                <input type="file" id="profile-image-upload" class="hidden" accept="image/png, image/jpeg">
                <button id="profile-image-upload-button" class="text-sm text-amber-700 hover:text-amber-800 font-semibold">
                    Endre profilbilde
                </button>
            </div>

            <!-- Visningsnavn-seksjon -->
            <form id="profile-form">
                <div class="mb-4">
                    <label for="display-name" class="block font-semibold mb-2" style="color: var(--color-text-main);">Visningsnavn</label>
                    <input type="text" id="display-name" required class="w-full px-4 py-2 border border-stone-300 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-600" placeholder="Ditt visningsnavn">
                </div>

                <div class="mb-6">
                    <label for="profile-email" class="block font-semibold mb-2" style="color: var(--color-text-main);">E-post (kan ikke endres)</label>
                    <input type="email" id="profile-email" disabled class="w-full px-4 py-2 border border-stone-300 rounded-md" style="background-color: var(--color-bg-section); color: var(--color-text-muted);">
                </div>

                <button type="submit" id="profile-save-button" class="button button-primary button-lg" style="width: 100%;">
                    Lagre endringer
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container mx-auto px-6 text-center">
            <img src="Media/Logo/cfa-logo.jpg" alt="Cosplay for alle Logo" class="footer-logo">
            <p class="footer-title">Cosplay for alle (CfA)</p>
            <p class="footer-address">Norge • post@cosplayforalle.no</p>
            <p class="footer-copyright">&copy; 2026 Cosplay for alle (CfA). Alle rettigheter reservert.</p>
        </div>
    </footer>

    <!-- Dark Mode Floating Button -->
    <button class="theme-toggle" aria-label="Bytt tema">
        <svg class="moon-icon" style="width: 24px; height: 24px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="sun-icon hidden" style="width: 24px; height: 24px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
    </button>

    <script type="module" src="i18n.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="profil.js"></script>
</body>

</html>
